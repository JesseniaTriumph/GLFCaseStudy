# Continuous dependency-advisory alerts + update PRs (OWASP A06 / get-to-100 §8).
# `npm run deps:audit` is the point-in-time gate in CI; this is the always-on watch.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
